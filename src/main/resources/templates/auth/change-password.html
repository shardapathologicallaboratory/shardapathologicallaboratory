<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password - LCMS</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: html (pageTitle='Change Password', content=~{::content})}">
        <div th:fragment="content" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700">
                    <i data-lucide="key" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Change Password</h1>
                    <p class="text-xs text-slate-500">Update your account credentials</p>
                </div>
            </div>

            <form th:action="@{/change-password}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Current Password</label>
                    <input type="password" name="currentPassword" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-clinical-600 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">New Password</label>
                    <input type="password" name="newPassword" required minlength="6"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-clinical-600 outline-none">
                    <p class="text-[11px] text-slate-400 mt-1">Must be at least 6 characters</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Confirm New Password</label>
                    <input type="password" name="confirmPassword" required minlength="6"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-clinical-600 outline-none">
                </div>

                <div class="pt-2 flex space-x-3">
                    <a href="/" class="w-1/2 py-2.5 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition">
                        Cancel
                    </a>
                    <button type="submit" class="w-1/2 py-2.5 bg-clinical-600 hover:bg-clinical-700 text-white text-sm font-semibold rounded-xl transition shadow-md shadow-teal-500/20">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
